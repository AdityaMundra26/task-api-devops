# Second CI tool alongside Jenkins: builds and tests on every push / pull request.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        run: mvn -B clean test

      - name: Build JAR
        run: mvn -B package -DskipTests

      - name: Rename JAR with commit SHA
        run: cp target/task-api.jar "target/task-api-${GITHUB_SHA::7}.jar"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-api-jar
          path: target/task-api-*.jar

      - name: Build Docker image
        run: docker build -t task-api:${GITHUB_SHA::7} .
