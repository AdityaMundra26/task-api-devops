# Target host(s) for the task-api deployment.
# Default: a Docker container named "app-host" acting as the server
#   docker run -d --name app-host -p 8081:8080 ubuntu:22.04 sleep infinity
[app_servers]
app-host ansible_connection=community.docker.docker ansible_user=root ansible_become=false

# Alternative A: an Ubuntu VM over SSH (comment out the line above, uncomment this)
# vm1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Alternative B: this machine itself (Ubuntu / WSL with systemd)
# localhost ansible_connection=local
