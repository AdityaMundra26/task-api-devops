# Settings kept OUT of the code and the Deployment YAML.
# Change a value here, re-apply, then: kubectl rollout restart deployment/task-api
apiVersion: v1
kind: ConfigMap
metadata:
  name: task-api-config
  labels:
    app: task-api
data:
  APP_PORT: "8080"
  APP_ENV: "kubernetes"
  APP_VERSION: "1.0.0"
