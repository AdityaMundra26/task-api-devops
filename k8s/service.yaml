apiVersion: v1
kind: Service
metadata:
  name: task-api-service
  labels:
    app: task-api
spec:
  type: NodePort
  selector:
    app: task-api          # matches the Deployment's pod labels
  ports:
    - name: http
      port: 80             # port inside the cluster
      targetPort: http     # containerPort 8080 on the pods
      nodePort: 30080      # port on the Minikube node
