spring.application.name=task-api

# Every value below can be overridden by an environment variable.
# In Kubernetes they come from the ConfigMap (k8s/configmap.yaml);
# with Ansible they come from the systemd unit (roles/task_api/templates).
server.port=${APP_PORT:8080}
app.version=${APP_VERSION:1.0.0}
app.env=${APP_ENV:local}

# Expose /actuator/health (+ liveness/readiness groups for K8s probes) and /actuator/info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
